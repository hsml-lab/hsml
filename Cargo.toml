[package]
name = "hsml"
version = "0.2.0"
authors = ["Christopher Quadflieg <chrissi92@hotmail.de>"]
edition = "2024"
description = "A pug-inspired HTML preprocessor"
repository = "https://github.com/hsml-lab/hsml"
homepage = "https://github.com/hsml-lab/hsml"
license = "MIT"
rust-version = "1.88"
keywords = ["hsml", "html", "preprocessor", "wasm"]
categories = [
    "api-bindings",
    "command-line-utilities",
    "compilers",
    "parser-implementations",
]
exclude = [
    "/.claude",
    "/.github",
    "/.vscode",
    "/coverage",
    "CONTRIBUTING.md",
    "example.hsml",
    "example2.hsml",
    "finite_state_machine.dot",
    "notes.md",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nom = "8.0.0"
nom_locate = "5.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.149"
wasm-bindgen = "0.2.114"

# CLI and LSP dependencies are excluded from wasm builds, which only need the parser and compiler
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.0", features = ["cargo"] }
ignore = "0.4.25"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "io-std"] }
tower-lsp = "0.20.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
assert_cmd = "=2.2.0"
predicates = "=3.1.4"
tempfile = "=3.27.0"

[dev-dependencies]
js-sys = "=0.3.91"
wasm-bindgen-test = "=0.3.64"
