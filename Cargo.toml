[package]
name = "hsml"
version = "0.1.0"
authors = ["Christopher Quadflieg <chrissi92@hotmail.de>"]
edition = "2024"
description = "A pug-inspired HTML preprocessor"
repository = "https://github.com/hsml-lab/hsml"
license = "MIT"
keywords = ["hsml", "html", "preprocessor"]
categories = [
    "api-bindings",
    "command-line-utilities",
    "compilers",
    "parser-implementations",
]
exclude = [
    "/.github",
    "/.vscode",
    "example.hsml",
    "example2.hsml",
    "finite_state_machine.dot",
    "notes.md",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nom = "8.0.0"
wasm-bindgen = "0.2.114"

# CLI and LSP dependencies are excluded from wasm builds, which only need the parser and compiler
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.0", features = ["cargo"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "io-std"] }
tower-lsp = "0.20.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
assert_cmd = "2.2.0"
predicates = "3.1.4"
tempfile = "3.27.0"
