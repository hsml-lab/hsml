name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: publish-crate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install wasm-pack
        run: cargo install wasm-pack@0.14.0

      - name: Build WASM package
        run: wasm-pack build --target bundler

      - name: Patch TypeScript types
        shell: bash
        run: |
          sed -i 's/compileContentWithDiagnostics(source: string): any/compileContentWithDiagnostics(source: string): CompileResult/' pkg/hsml.d.ts
          {
            echo ''
            echo 'export interface Location {'
            echo '  line: number;'
            echo '  column: number;'
            echo '}'
            echo ''
            echo 'export interface Diagnostic {'
            echo '  severity: "error" | "warning";'
            echo '  message: string;'
            echo '  code?: string;'
            echo '  location?: Location;'
            echo '  filePath?: string;'
            echo '}'
            echo ''
            echo 'export interface CompileResult {'
            echo '  success: boolean;'
            echo '  html: string | null;'
            echo '  diagnostics: Diagnostic[];'
            echo '}'
          } >> pkg/hsml.d.ts

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        working-directory: pkg
