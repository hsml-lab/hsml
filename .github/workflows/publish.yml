name: Publish

on:
  workflow_run:
    workflows: ['Release']
    types:
      - completed

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crate:
    name: Publish to crates.io
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: publish-crate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install wasm-pack
        run: cargo install wasm-pack@0.14.0

      - name: Build WASM package
        run: wasm-pack build --target bundler

      - name: Patch TypeScript types
        shell: bash
        run: |
          sed -i 's/compileContentWithDiagnostics(source: string, options: any)/compileContentWithDiagnostics(source: string, options?: CompileOptions): CompileResult/' pkg/hsml.d.ts
          sed -i 's/formatContent(source: string, options: any)/formatContent(source: string, options?: FormatContentOptions)/' pkg/hsml.d.ts
          {
            echo ''
            echo '/** A single point in source code. */'
            echo 'export interface Position {'
            echo '  /** Line number (1-based). */'
            echo '  line: number;'
            echo '  /** Column number (1-based). */'
            echo '  column: number;'
            echo '}'
            echo ''
            echo '/** A span in source code, defined by a start and end position. */'
            echo 'export interface Location {'
            echo '  /** Start position of the span (inclusive). */'
            echo '  start: Position;'
            echo '  /** End position of the span (exclusive). */'
            echo '  end: Position;'
            echo '}'
            echo ''
            echo '/** A diagnostic message (error or warning) from the HSML compiler. */'
            echo 'export interface Diagnostic {'
            echo '  /** Severity level of this diagnostic. */'
            echo '  severity: "error" | "warning";'
            echo '  /** Human-readable description of the issue. */'
            echo '  message: string;'
            echo '  /** Error or warning code (e.g. "E001", "W002"). */'
            echo '  code?: string;'
            echo '  /** Source location where the issue was found. */'
            echo '  location?: Location;'
            echo '  /** File path, if available. */'
            echo '  filePath?: string;'
            echo '}'
            echo ''
            echo '/** Options for compiling HSML source. */'
            echo 'export interface CompileOptions {'
            echo '  /** Emit pretty-printed HTML with indentation (default: false). */'
            echo '  pretty?: boolean;'
            echo '  /** Number of spaces per indentation level (default: 2). */'
            echo '  indentSize?: number;'
            echo '}'
            echo ''
            echo '/** Result of compiling HSML source with diagnostic support. */'
            echo 'export interface CompileResult {'
            echo '  /** Whether compilation succeeded without errors. */'
            echo '  success: boolean;'
            echo '  /** The compiled HTML output, or null if compilation failed. */'
            echo '  html: string | null;'
            echo '  /** All diagnostics (errors and warnings) collected during compilation. */'
            echo '  diagnostics: Diagnostic[];'
            echo '}'
            echo ''
            echo '/** Options for formatting HSML source. */'
            echo 'export interface FormatContentOptions {'
            echo '  /** Number of spaces per indentation level (default: 2). */'
            echo '  indentSize?: number;'
            echo '  /** Maximum line width before wrapping attributes (default: 80). */'
            echo '  printWidth?: number;'
            echo '}'
          } >> pkg/hsml.d.ts

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.16.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        working-directory: pkg
